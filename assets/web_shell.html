<!doctype html>
<meta charset="utf-8">
<!-- initial-scale and nothing else. The canvas is sized by the backend in whole multiples
     and the browser is not allowed to magnify or pan it, so nothing here may pin or cap
     the scale: this is the device's own screen size and the backend fits the game to it. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The canvas is centred by the layout and not by offsets read out of the window: a
     browser that counts anything else in the flow when placing it — iPad Safari counted
     the button below — puts the field off centre, and no amount of measuring the window
     afterwards moves it back. Flexbox centres what is in the flow, which is the canvas
     and nothing else. */
  body { display: flex; align-items: center; justify-content: center; }
  /* Fixed, so a failure cannot push the canvas out of the middle while it is being read. */
  #fail { position: fixed; top: 0; left: 0; right: 0; z-index: 2; }
  /* none: the only gestures that reach this game are the game's own. A browser free to
     pinch and pan the page under a canvas sized in whole multiples makes the scale
     whatever the last gesture left it. The platform sets the same value inline. */
  #canvas { display: block; touch-action: none; flex: none; }
  /* The button lives in the widest bar around the canvas and only while a bar has room
     for it. A page button on top of the game would sit on Выход, the one control that has
     to stay reachable, and one placed at a fixed offset from the bottom went off screen
     the moment the canvas was not where that offset assumed. */
  #full {
    position: fixed; font: 12px/1 sans-serif; color: #bbb; background: #1b1f27;
    border: 1px solid #444; border-radius: 3px; padding: 5px 9px; cursor: pointer;
  }
</style>
<body>
<pre id="fail" hidden style="color:#f66;font:14px/1.4 monospace;padding:10px;white-space:pre-wrap"></pre>
<canvas id="canvas"></canvas>
<button id="full" hidden>во весь экран</button>
<script>
/* The stock emscripten shell answers a failure with a line of grey text beside its own
 * logo and leaves the canvas black. A black screen is the worst possible report — it
 * reads as "the game did not start" and has to be diagnosed from a console nobody
 * opened — so a failure is written where a player already is. */
function report(msg, src, line, col) {
  var p = document.getElementById("fail");
  p.hidden = false;
  p.textContent = "failed: " + msg + "\n  " + src + ":" + line + ":" + col;
  document.title = "failed";
  return true;
}
window.onerror = function (msg, src, line, col) { return report(msg, src, line, col); };
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason;
  report(r && r.message ? r.message : String(r), "", 0, 0);
});

/* Fullscreen, in the widest bar around the canvas: the four strips the canvas leaves
 * free are measured, the roomiest one that can hold the button takes it, and the button
 * goes to its middle. Recomputed on every call rather than parked at an offset, because
 * an offset from the bottom is only right for the layout it was written against and the
 * canvas is not always there — rotated, in fullscreen, or scaled down to fit.
 *
 * When no strip has room the button still has to exist: in fullscreen it is the way out,
 * so it goes to the corner of the largest strip anyway and is clamped inside the window.
 * Off screen is the one outcome that leaves the player stuck.
 *
 * iPhone Safari has no element fullscreen at all, so the request is guarded: a phone that
 * cannot do it must not get an error for asking.
 *
 * The document goes fullscreen rather than the canvas, and that is the whole reason the
 * controls stay reachable: a fullscreen canvas is the only thing on screen, so the
 * button that got you there disappears with it, and the top strip of the game ends up
 * offset by margins meant for a page that is no longer there. */
var full = document.getElementById("full");
function place() {
  var c = document.getElementById("canvas");
  var page = document.documentElement;
  if (!c) { return; }
  var W = page.clientWidth, H = page.clientHeight;
  var r = c.getBoundingClientRect();
  var bw = full.offsetWidth, bh = full.offsetHeight;
  var L = Math.round(r.left), T = Math.round(r.top);
  var R = Math.round(r.right), B = Math.round(r.bottom);
  var bars = [
    { x: 0, y: 0, w: W, h: T },
    { x: 0, y: B, w: W, h: H - B },
    { x: 0, y: 0, w: L, h: H },
    { x: R, y: 0, w: W - R, h: H }
  ];
  var best = null, i, b;
  for (i = 0; i < bars.length; i++) {
    b = bars[i];
    if (b.w < bw + 8 || b.h < bh + 8) { continue; }
    if (best === null || b.w * b.h > best.w * best.h) { best = b; }
  }
  if (best === null) {
    for (i = 0; i < bars.length; i++) {
      if (bars[i].w * bars[i].h > (best === null ? -1 : best.w * best.h)) { best = bars[i]; }
    }
  }
  full.hidden = false;
  full.style.left = Math.max(0, Math.min(W - bw, Math.round(best.x + (best.w - bw) / 2))) + "px";
  full.style.top = Math.max(0, Math.min(H - bh, Math.round(best.y + (best.h - bh) / 2))) + "px";
}
full.onclick = function () {
  var page = document.documentElement;
  if (document.fullscreenElement) {
    if (document.exitFullscreen) { document.exitFullscreen(); }
    return;
  }
  if (page.requestFullscreen) { page.requestFullscreen(); }
  else if (page.webkitRequestFullscreen) { page.webkitRequestFullscreen(); }
};
window.addEventListener("resize", place);
/* Entering and leaving fullscreen change where the canvas sits, and the backend only
 * rewrites the canvas when it thinks something moved. The event is repeated as a resize
 * so that path runs: without it the canvas kept the offsets it had for the other mode,
 * and the bars the button measures itself against were the wrong shape. */
document.addEventListener("fullscreenchange", function () {
  place();
  window.dispatchEvent(new Event("resize"));
});
/* The canvas is sized by the backend on its first frame, so its bar does not exist yet
 * when load fires. */
setInterval(place, 500);
</script>
