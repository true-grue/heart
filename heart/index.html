<!doctypehtml><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Quest</title><style>body,html{margin:0;height:100%;background:#000;overflow:hidden}#canvas{display:block;touch-action:none;margin:0 auto}#full{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;font:12px/1 sans-serif;color:#bbb;background:#1b1f27;border:1px solid #444;border-radius:3px;padding:5px 9px;cursor:pointer}</style><body><pre hidden id=fail style="color:#f66;font:14px/1.4 monospace;padding:10px;white-space:pre-wrap"></pre><canvas id=canvas></canvas><button hidden id=full>во весь экран</button><script>function report(e,t,n,l){var u=document.getElementById("fail");return u.hidden=!1,u.textContent="failed: "+e+"\n  "+t+":"+n+":"+l,document.title="failed",!0}window.onerror=function(e,t,n,l){return report(e,t,n,l)},window.addEventListener("unhandledrejection",function(e){var t=e.reason;report(t&&t.message?t.message:String(t),"",0,0)});var full=document.getElementById("full");function place(){var e=document.getElementById("canvas"),t=document.documentElement;if(e){var n=e.getBoundingClientRect(),l=t.clientHeight-n.bottom;full.hidden=!(l>=full.offsetHeight+8),full.style.bottom=Math.max(4,Math.floor(l/2)-full.offsetHeight/2)+"px"}}full.onclick=function(){var e=document.getElementById("canvas"),t=document.documentElement;document.fullscreenElement?document.exitFullscreen&&document.exitFullscreen():e.requestFullscreen?e.requestFullscreen():t.requestFullscreen?t.requestFullscreen():e.webkitRequestFullscreen&&e.webkitRequestFullscreen()},window.addEventListener("resize",place),setInterval(place,500)</script><script async src=index.js></script></body>
