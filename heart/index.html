<!doctypehtml><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Quest</title><style>body,html{margin:0;height:100%;background:#000;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#fail{position:fixed;top:0;left:0;right:0;z-index:2}#canvas{display:block;touch-action:none;flex:none}#full{position:fixed;font:12px/1 sans-serif;color:#bbb;background:#1b1f27;border:1px solid #444;border-radius:3px;padding:5px 9px;cursor:pointer}</style><body><pre hidden id=fail style="color:#f66;font:14px/1.4 monospace;padding:10px;white-space:pre-wrap"></pre><canvas id=canvas></canvas><button hidden id=full>во весь экран</button><script>function report(e,t,n,l){var u=document.getElementById("fail");return u.hidden=!1,u.textContent="failed: "+e+"\n  "+t+":"+n+":"+l,document.title="failed",!0}window.onerror=function(e,t,n,l){return report(e,t,n,l)},window.addEventListener("unhandledrejection",function(e){var t=e.reason;report(t&&t.message?t.message:String(t),"",0,0)});var full=document.getElementById("full");function place(){var e=document.getElementById("canvas"),t=document.documentElement;if(e){var n,l=t.clientWidth,u=t.clientHeight,o=e.getBoundingClientRect(),r=full.offsetWidth,d=full.offsetHeight,a=Math.round(o.bottom),i=Math.round(l-o.right),c=u-a;c>=d+8?(n="below",full.style.left=Math.max(0,Math.round((l-r)/2))+"px",full.style.top=Math.round(a+(c-d)/2)+"px"):i>=r+8?(n="right",full.style.left=Math.round(l-i+(i-r)/2)+"px",full.style.top=Math.max(0,Math.round(o.top+(Math.round(o.height)-d)/2))+"px"):(n="flush",full.style.left=Math.max(0,Math.round((l-r)/2))+"px",full.style.top=Math.max(0,u-d-4)+"px"),full.dataset.side=n,full.hidden=!1}}full.onclick=function(){var e=document.documentElement;document.fullscreenElement?document.exitFullscreen&&document.exitFullscreen():e.requestFullscreen?e.requestFullscreen():e.webkitRequestFullscreen&&e.webkitRequestFullscreen()},window.addEventListener("resize",place),document.addEvent
