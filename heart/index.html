<!doctypehtml><meta charset=utf-8><title>Quest</title><style>body,html{margin:0;height:100%;background:#000;overflow:hidden}#canvas{display:block;touch-action:none;margin:0 auto}</style><body><pre hidden id=fail style="color:#f66;font:14px/1.4 monospace;padding:10px;white-space:pre-wrap"></pre><canvas id=canvas></canvas><script>function report(e,n,t,r){var o=document.getElementById("fail");return o.hidden=!1,o.textContent="failed: "+e+"\n  "+n+":"+t+":"+r,document.title="failed",!0}window.onerror=function(e,n,t,r){return report(e,n,t,r)},window.addEventListener("unhandledrejection",function(e){var n=e.reason;report(n&&n.message?n.message:String(n),"",0,0)})</script><script async src=index.js></script></body>
